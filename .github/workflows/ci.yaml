name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  docker-build-scan-push:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v4

      - name: Build Image (test run inside the build container)
        run: docker build -t barry1234/demo-node-app:latest .

      - name: Scan image using trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: barry1234/demo-node-app:latest
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: barry1234
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        run: docker push barry1234/demo-node-app:latest